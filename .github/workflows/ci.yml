name: CI

# Reference CI pipeline. One workflow, one job per component, each gated by
# a path filter so that a change to one component does not rebuild the rest
# of the platform. Every job runs unit tests only: nothing here assumes a
# running Postgres, Kafka or Docker Compose stack. Integration behaviour
# (the Trade Executor against a live Kafka broker, the Trade REST API
# against a running Postgres) is exercised locally under Docker Compose,
# not in this pipeline.
#
# Paths match docker-compose.yml's build contexts: Java and Node services
# live under services/<name>, the Portfolio and P&L extension lives under
# extensions/portfolio-pnl, and analytics and ui are top level.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Decide which components changed. Every job below depends on this one
  # and runs only if its own path filter matched. dorny/paths-filter
  # compares against the pull request base branch on a pull_request event,
  # and against the previous pushed commit on a push event.
  # ---------------------------------------------------------------------
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      trading-engine: ${{ steps.filter.outputs.trading-engine }}
      trade-api: ${{ steps.filter.outputs.trade-api }}
      trade-executor: ${{ steps.filter.outputs.trade-executor }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      auth-stub: ${{ steps.filter.outputs.auth-stub }}
      ui: ${{ steps.filter.outputs.ui }}
      analytics: ${{ steps.filter.outputs.analytics }}
      market-data-poller: ${{ steps.filter.outputs.market-data-poller }}
      portfolio-pnl: ${{ steps.filter.outputs.portfolio-pnl }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            trading-engine:
              - 'services/trading-engine/**'
            trade-api:
              - 'services/trade-api/**'
            trade-executor:
              - 'services/trade-executor/**'
            auth-service:
              - 'services/auth-service/**'
            auth-stub:
              - 'services/auth-stub/**'
            ui:
              - 'ui/**'
            analytics:
              - 'analytics/**'
            market-data-poller:
              - 'services/market-data-poller/**'
            portfolio-pnl:
              - 'extensions/portfolio-pnl/**'

  # ---------------------------------------------------------------------
  # Java, Maven. The trading domain engine (Sprint 5), packaged again
  # inside the Trade REST API from Sprint 6. Both are tested independently
  # because the engine has no framework dependency and must pass on its
  # own.
  # ---------------------------------------------------------------------
  trading-engine:
    name: Trading domain engine (mvn test)
    needs: changes
    if: needs.changes.outputs.trading-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/trading-engine
        run: mvn -B --no-transfer-progress test

  trade-api:
    name: Trade REST API (mvn test)
    needs: changes
    if: needs.changes.outputs.trade-api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/trade-api
        run: mvn -B --no-transfer-progress test

  trade-executor:
    name: Trade Executor (mvn test)
    needs: changes
    if: needs.changes.outputs.trade-executor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/trade-executor
        run: mvn -B --no-transfer-progress test

  portfolio-pnl:
    name: Portfolio and P&L extension (mvn test)
    needs: changes
    if: needs.changes.outputs.portfolio-pnl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: extensions/portfolio-pnl
        run: mvn -B --no-transfer-progress test

  # ---------------------------------------------------------------------
  # Node, npm. auth-stub is a provided fixture with no assessed tests (see
  # docs/DECISIONS.md, decision 5), so its test step uses --if-present and
  # does not fail the job when there is nothing to run.
  # ---------------------------------------------------------------------
  auth-service:
    name: Auth service (npm test)
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - name: npm ci
        working-directory: services/auth-service
        run: npm ci
      - name: npm test
        working-directory: services/auth-service
        run: npm test --if-present

  auth-stub:
    name: Node auth stub (npm test, fixture)
    needs: changes
    if: needs.changes.outputs.auth-stub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/auth-stub/package-lock.json
      - name: npm ci
        working-directory: services/auth-stub
        run: npm ci
      - name: npm test
        working-directory: services/auth-stub
        run: npm test --if-present

  ui:
    name: Angular UI (lint, test, build)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        working-directory: ui
        run: npm ci
      - name: Lint
        working-directory: ui
        run: npm run lint --if-present
      - name: Unit tests
        # The Angular application builder's unit-test runner is Vitest
        # based (jsdom), not Karma: there is no --browsers flag to pass.
        # --watch=false makes the single-run behaviour explicit rather than
        # relying on CI environment auto-detection.
        working-directory: ui
        run: npx ng test --watch=false
      - name: Build
        working-directory: ui
        run: npx ng build

  # ---------------------------------------------------------------------
  # Python, pip and pytest. Installation tries pyproject.toml first (the
  # analytics package builds with hatchling and keeps pytest in its "dev"
  # optional dependency group), and falls back to requirements.txt for a
  # component packaged the simpler way, so this step works whichever
  # convention a given component uses.
  # ---------------------------------------------------------------------
  analytics:
    name: Analytics ETL and dashboard (pytest)
    needs: changes
    if: needs.changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - name: Install dependencies
        working-directory: analytics
        run: |
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt
            pip install pytest
          fi
      - name: pytest
        working-directory: analytics
        run: pytest

  market-data-poller:
    name: Market-data poller (pytest)
    needs: changes
    if: needs.changes.outputs.market-data-poller == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/market-data-poller/pyproject.toml
            services/market-data-poller/requirements.txt
      - name: Install dependencies
        working-directory: services/market-data-poller
        run: |
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt
            pip install pytest
          fi
      - name: pytest
        working-directory: services/market-data-poller
        run: pytest
