[project]
name = "analytics"
version = "0.1.0"
description = "Enterprise Trading Platform: batch ETL, dashboard and Kafka sink over the analytical star schema (Sprints 4 and 7)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "requests>=2.32.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "kafka-python-ng>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
etl = "analytics.cli:etl_main"
dashboard = "analytics.cli:dashboard_main"
kafka-sink = "analytics.cli:kafka_sink_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
