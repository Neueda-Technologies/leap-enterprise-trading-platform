# Enterprise Trading Platform, shared local infrastructure.
#
# This file wires the three infrastructure containers every team needs from
# Sprint 3 onwards, plus the provided auth stub. It does not wire any service
# you write. Add your own service to this file in the sprint that builds it:
# the Trade REST API in Sprint 6, the Trade Executor and the market-data
# poller in Sprint 7, the auth service in Sprint 8, the extensions in
# Sprint 10. By the end of the capstone this file describes your whole
# platform, and every line in it was added by your team for a reason you can
# explain.
#
# Environment variables are read from .env at the repository root. Copy
# .env.example to .env before running anything here. .env is git-ignored and
# stays that way.
#
# See infra/README.md for start, stop, reset and connection details.

networks:
  trading-net:
    name: trading-net

volumes:
  postgres-data:
  kafka-data:

services:

  # Empty Postgres 16 instance. No schema and no data ship with this branch:
  # designing the schema is the Sprint 3 deliverable. Anything you place in
  # infra/postgres with a .sql or .sh extension runs once, in filename order,
  # the first time the container starts against an empty volume.
  postgres:
    image: postgres:16
    container_name: postgres
    networks: [trading-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Single-broker Kafka in KRaft mode: combined broker and controller, no
  # ZooKeeper. 9092 is the address the host and any tool outside compose use.
  # 29092 is the address services inside the compose network use. Point your
  # own containers at kafka:29092 and your laptop at localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    networks: [trading-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # One-shot topic creation. Runs infra/kafka/create-topics.sh once the broker
  # reports healthy, then exits. Auto-creation is switched off above because it
  # silently produces a one-partition, default-retention topic, which is wrong
  # for all three topics in contracts/kafka-topics.md.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    networks: [trading-net]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/kafka-scripts/create-topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    entrypoint: ["bash", "/kafka-scripts/create-topics.sh"]
    restart: "no"

  # Provided fixture, used from Sprint 6 and retired in Sprint 8. Issues JWTs
  # with the claims contract in contracts/auth-api.yaml so that the Trade REST
  # API can be built against real token verification before Node is taught.
  # Listens on 3001 and is published on 3001, which leaves port 3000 free for
  # the auth service you build in Sprint 8. Idle before Sprint 6, so leave it
  # running or stop it, whichever you prefer.
  auth-stub:
    build:
      context: ./services/auth-stub
    container_name: auth-stub
    networks: [trading-net]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3001' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
