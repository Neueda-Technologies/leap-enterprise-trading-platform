[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-poller"
version = "1.0.0"
description = "Polls Fauxnance batch quotes and publishes them to the market-data topic."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "kafka-python>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
market-data-poller = "market_data_poller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the package from src without an editable install, so a participant can clone
# the repository and run pytest without a build step.
pythonpath = ["src"]
addopts = "-q"
