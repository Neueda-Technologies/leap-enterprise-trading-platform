[project]
name = "etl-starter"
version = "0.1.0"
description = "Enterprise Trading Platform: batch loader from the operational database into the analytical star schema."
requires-python = ">=3.12"

dependencies = [
    "duckdb>=1.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
etl-starter = "etl_starter.loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
