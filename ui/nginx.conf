server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The router owns the URL space. A reload of /orders/new must return index.html rather than
  # a 404, because there is no file at that path. This one line is what makes deep links work,
  # and it is the same rule the CloudFront error-response mapping applies in Sprint 11.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build output is content-hashed, so it can be cached indefinitely.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is not hashed. Caching it strands users on an old bundle after a deployment.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Baseline response headers. HTTPS and HSTS are terminated in front of this in Sprint 11.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
